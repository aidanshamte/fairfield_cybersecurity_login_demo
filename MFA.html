<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cisco Duo MFA Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .card {
      width: 390px;
      max-width: calc(100% - 32px);
      padding: 36px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      margin-bottom: 20px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-size: 12px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    input {
      width: 100%;
      margin: 18px 0 12px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 7px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #12588e;
    }

    .error {
      display: none;
      color: #c62828;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .success {
      display: none;
      color: #287a35;
      margin-top: 18px;
    }

    .training-note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #777;
    }
	.cardd {
  width: 390px;
  max-width: calc(100% - 32px);
  overflow: hidden;
}

.cardd img {
  display: block;
  width: 100%;
  height: auto;
}
  </style>
</head>

<body>

  <main class="card">
	<div class="cardd">
    <img src="./MFA.PNG" alt="MFA" />
		
    <br>

    <h1>Verify your identity</h1>

    <p>
      Enter the six-digit verification passcode generated by your Duo Mobile app.
    </p>

    <form id="mfaForm">
      <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        pattern="[0-9]{6}"
        placeholder="000000"
        aria-label="Six digit verification code"
        required
      >

      <div id="error" class="error">
        Please enter a valid six-digit training code.
      </div>

      <button type="submit">
        Verify
      </button>
    </form>

    <div id="success" class="success">
    </div>

  
  </main>

  <script>
    const form = document.getElementById("mfaForm");
    const codeInput = document.getElementById("code");
    const error = document.getElementById("error");
    const success = document.getElementById("success");

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value
        .replace(/\D/g, "")
        .slice(0, 6);

      error.style.display = "none";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = codeInput.value.trim();

      if (!/^\d{6}$/.test(code)) {
        error.style.display = "block";
        return;
      }

      
      success.style.display = "block";
      form.style.display = "none";
    });
  </script>

</body>
</html>
